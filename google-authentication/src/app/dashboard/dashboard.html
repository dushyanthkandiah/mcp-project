<div class="container-fluid h-100 p-0">
    <div class="row h-100 g-0">
        <div class="col-12">
            <!-- Chat Container -->
            <div class="chat-container">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="d-flex align-items-center">
                        <div class="avatar-wrapper me-3">
                            <i class="bi bi-robot"></i>
                        </div>
                        <div>
                            <h5 class="mb-0">AI Assistant</h5>
                            <small class="text-muted">Powered by Google Gemini</small>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-link text-white" title="Clear conversation"
                            (click)="clearConversation()">
                            <i class="bi bi-trash"></i>
                        </button>
                        <button class="btn btn-link text-white" title="Settings">
                            <i class="bi bi-gear"></i>
                        </button>
                        <button class="btn btn-link text-white" title="More options">
                            <i class="bi bi-three-dots-vertical"></i>
                        </button>
                    </div>
                </div>

                <!-- Chat Messages -->
                <div class="chat-messages">
                    <div *ngFor="let message of messages" [class.user-message]="message.isUser"
                        [class.ai-message]="!message.isUser" [class.error-message]="message.isError"
                        class="message-wrapper">
                        <div class="message-bubble">
                            <div class="message-content" [style.white-space]="'pre-wrap'">{{ message.text }}</div>
                            <div class="message-time">
                                {{ message.timestamp | date:'short' }}
                            </div>
                        </div>
                    </div>

                    <!-- Typing Indicator -->
                    <div *ngIf="isTyping" class="message-wrapper ai-message">
                        <div class="message-bubble typing-indicator">
                            <div class="typing-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chat Input -->
                <div class="chat-input">
                    <div class="input-group">
                        <button class="btn btn-outline-secondary" type="button" title="Attach file">
                            <i class="bi bi-paperclip"></i>
                        </button>
                        <textarea class="form-control" placeholder="Type your message..." [(ngModel)]="userInput"
                            (keypress)="handleKeyPress($event)" rows="1"></textarea>
                        <button class="btn btn-primary" type="button" (click)="sendMessage()"
                            [disabled]="!userInput.trim()">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                    <div class="input-hint">
                        <small class="text-muted">
                            <i class="bi bi-lightbulb"></i> Press Enter to send, Shift+Enter for new line
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
